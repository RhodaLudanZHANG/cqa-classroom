<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; img-src 'self' data:; font-src 'self'; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Temporary operator canary authentication</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell"><section class="card">
      <h1>Temporary operator canary</h1>
      <p>For synthetic browser acceptance only. Remove this helper after acceptance.</p>
      <form id="operator-auth" class="login-form" autocomplete="off">
        <label>Account <select id="operator-account" required></select></label>
        <label>Password <input id="operator-password" type="password" autocomplete="off" required></label>
        <button id="operator-submit" class="primary" type="submit" disabled>Establish canary session</button>
      </form>
      <p id="operator-status" role="status">Checking canary configuration…</p>
    </section></main>
    <script src="./config.js"></script>
    <script type="module" src="./operator-auth.js"></script>
  </body>
</html>
